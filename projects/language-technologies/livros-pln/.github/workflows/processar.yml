# Reprocessa os livros sempre que o código muda e publica os resultados no repositório.
#
# Corre quando há alterações no pacote (livros_pln/), na configuração (config/), nas
# dependências ou neste workflow. Os testes têm de passar antes do processamento.
# Os resultados (resultados/) são guardados num commit automático; esse commit não volta
# a disparar o workflow (os commits feitos com o GITHUB_TOKEN não disparam workflows).
# Também pode ser corrido à mão: separador Actions → «processar livros» → Run workflow.
name: processar livros

on:
  push:
    branches: [main]
    paths:
      - "livros_pln/**"
      - "config/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/processar.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reprocessar todos os livros, mesmo sem alterações"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: processar-livros
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-modelos.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Instalar modelos spaCy (pt, fr, en)
        run: bash .github/scripts/instalar_modelos.sh

      - name: Testes
        run: python -m pytest -q

      - name: Processar livros
        run: python -m livros_pln ${{ inputs.forcar && '--forcar' || '' }}

      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados
          if git diff --cached --quiet; then
            echo "Resultados sem alterações."
            exit 0
          fi
          versao=$(python -c "import livros_pln; print(livros_pln.__version__)")
          git commit -m "Atualiza resultados (livros_pln ${versao}, commit ${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: resultados/
          retention-days: 30
