# Testes do projeto "Simulador de Juros Compostos" (projects/data-analysis/simulador-juros-compostos).
# Corre sempre que algo muda nessa pasta: testa os dois motores (Python e JavaScript), compara-os
# e confirma que os gráficos e os estudos de robustez se geram.
name: simulador-juros-compostos

on:
  push:
    paths: ["projects/data-analysis/simulador-juros-compostos/**", ".github/workflows/simulador-juros-compostos.yml"]
  pull_request:
    paths: ["projects/data-analysis/simulador-juros-compostos/**"]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/data-analysis/simulador-juros-compostos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes do motor JavaScript
        run: node scripts/testes_web.js
      - name: Testes do motor Python e comparação entre motores
        run: python scripts/testes.py
      - name: Gerar cenários e gráficos
        run: python scripts/correr_cenarios.py
      - name: Estudos de robustez
        run: python scripts/convergencia.py
