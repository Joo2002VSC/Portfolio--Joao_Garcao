# Livros-PLN (projects/language-technologies/livros-pln): reprocessa os livros e publica os resultados.
#
# Corre quando há alterações, na pasta do projeto, nos livros (livros/, incluindo metadados e dicionários de
# personagens), no pacote (livros_pln/), na configuração (config/), nos testes, nas dependências, no script
# dos modelos ou neste workflow. Os testes têm de passar antes do processamento.
# Os resultados (resultados/) são guardados num commit automático; esse commit não volta a disparar o
# workflow (os commits feitos com o GITHUB_TOKEN não disparam workflows).
# Também pode ser corrido à mão: separador Actions → «livros-pln» → Run workflow.
name: livros-pln

on:
  push:
    branches: [main]
    paths:
      - "projects/language-technologies/livros-pln/livros/**"
      - "projects/language-technologies/livros-pln/livros_pln/**"
      - "projects/language-technologies/livros-pln/config/**"
      - "projects/language-technologies/livros-pln/tests/**"
      - "projects/language-technologies/livros-pln/scripts/**"
      - "projects/language-technologies/livros-pln/requirements*.txt"
      - ".github/workflows/livros-pln.yml"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reprocessar todos os livros, mesmo sem alterações"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: livros-pln
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/language-technologies/livros-pln
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            projects/language-technologies/livros-pln/requirements.txt
            projects/language-technologies/livros-pln/requirements-dev.txt
            projects/language-technologies/livros-pln/requirements-modelos.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar modelos spaCy (pt, fr, en)
        run: bash scripts/instalar_modelos.sh

      - name: Léxico de emoções NRC EmoLex (descarregado; não pode ser redistribuído)
        uses: actions/cache@v4
        with:
          path: projects/language-technologies/livros-pln/lexicos
          key: nrc-emolex-v0.92

      - name: Descarregar o léxico, se não estiver em cache
        run: python -m livros_pln lexicos || echo "Sem léxico: as emoções ficam «desconhecido»."

      - name: Testes
        run: python -m pytest -q

      - name: Documentação sincronizada com o catálogo
        run: python -m livros_pln.documentacao && git diff --exit-code docs/

      - name: Processar livros
        run: python -m livros_pln ${{ inputs.forcar && '--forcar' || '' }}

      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados
          if git diff --cached --quiet; then
            echo "Resultados sem alterações."
            exit 0
          fi
          versao=$(python -c "import livros_pln; print(livros_pln.__version__)")
          git commit -m "Livros-PLN: atualiza resultados (livros_pln ${versao}, commit ${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livros-pln-resultados
          path: projects/language-technologies/livros-pln/resultados/
          retention-days: 30
